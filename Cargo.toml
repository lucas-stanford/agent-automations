[workspace]
resolver = "3"
members = ["aat/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Lucas Stanford"]
repository = "https://github.com/lucas-stanford/agent-automations"

[workspace.dependencies]
aat-model = { path = "aat/crates/aat-model" }
aat-spec = { path = "aat/crates/aat-spec" }
aat-state = { path = "aat/crates/aat-state" }
aat-agents = { path = "aat/crates/aat-agents" }
aat-run = { path = "aat/crates/aat-run" }
aat-clock = { path = "aat/crates/aat-clock" }
aat-tui = { path = "aat/crates/aat-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
