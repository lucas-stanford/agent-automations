[package]
name = "aat"
description = "Run Agent Automations through any agent CLI, with a terminal UI to manage them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "aat"

[lib]
name = "aat"
path = "src/lib.rs"

[[bin]]
name = "aat"
path = "src/main.rs"

[dependencies]
aat-model.workspace = true
aat-spec.workspace = true
aat-state.workspace = true
aat-agents.workspace = true
aat-run.workspace = true
aat-clock.workspace = true
aat-tui.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
serde_json.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
ratatui = "0.29"
tempfile.workspace = true
