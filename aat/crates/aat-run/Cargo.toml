[package]
name = "aat-run"
description = "The run engine: lock, hooks, the agent session, the record, and progress reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aat-model.workspace = true
aat-spec.workspace = true
aat-state.workspace = true
aat-agents.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
win32job = "2.0.3"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

# A stand-in agent CLI for this crate's tests: aat-agents' fake agent, plus the progress verbs, so
# a test run can report progress the way a real agent does.
[[bin]]
name = "aat-run-fake-agent"
path = "src/bin/aat-run-fake-agent.rs"
test = false
doc = false
